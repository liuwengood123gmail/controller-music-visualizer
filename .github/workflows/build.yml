name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -c release
      - name: Test
        run: swift test
      - name: Typecheck research probes
        run: |
          for f in docs/research/*.swift; do
            echo "== $f"
            swiftc -swift-version 5 -typecheck -import-objc-header docs/research/opus-shim.h "$f"
          done

  # ControllerCore 与平台无关：在 Linux 上也编译、跑测试，保证它不依赖 Apple 框架（Android / Windows 复用的前提）
  core-linux:
    runs-on: ubuntu-latest
    container: swift:6.2
    steps:
      - uses: actions/checkout@v4
      - name: Build ControllerCore
        run: swift build
      - name: Test ControllerCore
        run: swift test

  # Android：Swift 核心交叉编译成 .so → Kotlin 单测（契约 / 假引擎）→ 打 APK → x86_64 模拟器上跑 JNI 测试和启动冒烟
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 推到 master / Android 分支时更新 android-preview 预发布版（手机上直接下载 APK）
    env:
      SWIFT_VERSION: 6.3.3
      SWIFT_ANDROID_SDK_SHA256: d160cc3206dd1886dae3fef2337af5e25ec034692cd0ec225721c56cc69da7f5
      NDK_VERSION: 27.3.13750724
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Cache Swift toolchain
        id: swift-cache
        uses: actions/cache@v4
        with:
          path: /opt/swift
          key: swift-${{ env.SWIFT_VERSION }}-ubuntu24.04
      - name: Install Swift toolchain
        if: steps.swift-cache.outputs.cache-hit != 'true'
        run: |
          sudo mkdir -p /opt/swift && sudo chown $USER /opt/swift
          curl -sSL https://download.swift.org/swift-$SWIFT_VERSION-release/ubuntu2404/swift-$SWIFT_VERSION-RELEASE/swift-$SWIFT_VERSION-RELEASE-ubuntu24.04.tar.gz \
            | tar xz -C /opt/swift --strip-components=1
      - name: Install Android SDK packages
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-37.2" "ndk;$NDK_VERSION" > /dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> $GITHUB_ENV
      - name: Install Swift SDK for Android
        run: |
          /opt/swift/usr/bin/swift sdk install \
            https://download.swift.org/swift-$SWIFT_VERSION-release/android-sdk/swift-$SWIFT_VERSION-RELEASE/swift-$SWIFT_VERSION-RELEASE_android.artifactbundle.tar.gz \
            --checksum $SWIFT_ANDROID_SDK_SHA256
          # 安装位置因版本而异（~/.swiftpm 或 ~/.config/swiftpm），找到 SDK 里的脚本把 NDK 关联进去
          setup=$(find ~/.swiftpm ~/.config/swiftpm ~/.local/share/swiftpm -name setup-android-sdk.sh 2>/dev/null | head -1)
          echo "setup script: $setup"
          bash "$setup"
          echo "SWIFT_SDKS_DIR=$(dirname $(dirname $(dirname $(dirname "$setup"))))" >> $GITHUB_ENV
      - name: Build Swift core for Android (arm64 + x86_64)
        run: SWIFT=/opt/swift/usr/bin/swift ABIS="arm64-v8a x86_64" android/scripts/build-swift-android.sh
      - name: Kotlin unit tests (contract fixtures, fake engine)
        working-directory: android
        run: ./gradlew --no-daemon :engine-api:test :engine-fake:test
      - name: Build APK (arm64)
        working-directory: android
        env:
          CV_KEYSTORE_B64: ${{ secrets.CV_ANDROID_KEYSTORE_B64 }}
          CV_KEYSTORE_PASSWORD: ${{ secrets.CV_ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # 固定签名（Secrets 不可用时，例如外部 PR，退回 debug 签名）
          if [ -n "$CV_KEYSTORE_B64" ]; then
            echo "$CV_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/preview.p12"
            export CV_KEYSTORE="$RUNNER_TEMP/preview.p12"
          fi
          ./gradlew --no-daemon :app:assembleRelease
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$apksigner" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -m1 "SHA-256" || true
          mkdir -p ../dist && cp app/build/outputs/apk/release/app-release.apk ../dist/ControllerMusicVisualizer-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ControllerMusicVisualizer-android
          path: dist/ControllerMusicVisualizer-android.apk
      - name: Build emulator test APKs (x86_64)
        working-directory: android
        run: ./gradlew --no-daemon -Pcv.abis=arm64-v8a,x86_64 :app:assembleDebug :engine:assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator tests (JNI + app launch)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          working-directory: android
          script: bash scripts/emulator-smoke.sh
      - name: Publish android-preview pre-release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/heads/claude/p2-p3-android'))
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f android-preview && git push -f origin android-preview
          gh release view android-preview > /dev/null 2>&1 || \
            gh release create android-preview --prerelease --title "Android 预览版 / Android preview" \
              --notes "每次推送自动更新。下载 ControllerMusicVisualizer-android.apk 到手机安装（需允许安装未知来源的应用）。"
          gh release upload android-preview dist/ControllerMusicVisualizer-android.apk --clobber
          gh release edit android-preview --notes "提交 ${GITHUB_SHA::7}（${GITHUB_REF_NAME}）· 下载 ControllerMusicVisualizer-android.apk 到手机安装（需允许安装未知来源的应用）。"
